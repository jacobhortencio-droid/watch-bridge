plugins {
    id 'com.android.library'
}

android {
    namespace 'io.github.jacobhortencio.watchbridge.common'
    compileSdk 34

    defaultConfig {
        minSdk 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
