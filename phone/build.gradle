plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jacobhortencio.watchbridge.phone'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.jacobhortencio.watchbridge.phone'
        minSdk 33
        targetSdk 34
        versionCode rootProject.ext.wbVersionCode
        versionName rootProject.ext.wbVersionName
    }

    signingConfigs {
        shared {
            def ks = System.getenv('WB_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('WB_KEYSTORE_PASS')
                keyAlias 'watchbridge'
                keyPassword System.getenv('WB_KEYSTORE_PASS')
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':common')
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
