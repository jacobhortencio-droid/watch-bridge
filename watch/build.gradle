plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jacobhortencio.watchbridge.watch'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.jacobhortencio.watchbridge.watch'
        minSdk 33
        targetSdk 34
        versionCode rootProject.ext.wbVersionCode
        versionName rootProject.ext.wbVersionName
    }

    signingConfigs {
        shared {
            def ks = System.getenv('WB_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('WB_KEYSTORE_PASS')
                keyAlias 'watchbridge'
                keyPassword System.getenv('WB_KEYSTORE_PASS')
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':common')
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.wear.tiles:tiles:1.4.1'
    implementation 'androidx.wear.protolayout:protolayout:1.2.1'
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.2.1'
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    implementation 'com.google.guava:guava:33.3.1-android'
}
